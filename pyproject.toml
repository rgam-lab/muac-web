[project]
name = "aruco-toolkit"
version = "0.1.0"
description = "Minimal Python toolkit for ArUco marker detection and visualization"
requires-python = ">=3.10"

[tool.ruff]
line-length = 88
# Enable common rules; we’ll tune as repo grows.
select = ["E", "F", "I"]
ignore = []
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"