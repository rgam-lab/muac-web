<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
  <title>ChArUco Measure</title>
  <style>
    html,body { margin:0; padding:0; height:100%; background:#000; }
    #stage { position:fixed; inset:0; touch-action:manipulation; }
    canvas, video { position:absolute; inset:0; width:100%; object-fit:cover; }
    #v { opacity:0; } /* hidden video; we draw annotated frames instead */
    #msg { position:fixed; left:0; right:0; bottom:0; color:#0f0; background:#0007;
           font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:8px 10px; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="v" autoplay playsinline muted></video>
    <canvas id="tx"></canvas> <!-- offscreen encoding -->
    <canvas id="view"></canvas> <!-- annotated display -->
  </div>
  <div id="msg">Tap twice to pick two points (second tap = point 2). Double-tap to clear. HTTPS required on phones.</div>

  <script>
    // ------- Config (match your board) -------
    const BOARD = {
      dict: "4X4_50",
      squares_x: 5,
      squares_y: 7,
      square_m: 0.02,  // 20 mm
      marker_m: 0.014, // 14 mm
    };
    const POST_EVERY_MS = 120; // throttle network rate

    // ------- DOM -------
    const v = document.getElementById('v');
    const tx = document.getElementById('tx'); // encoder
    const view = document.getElementById('view'); // annotated
    const ctxT = tx.getContext('2d', { willReadFrequently: true });
    const ctxV = view.getContext('2d', { alpha:false });

    // ------- Camera -------
    async function startCam() {
      const isSecure = location.protocol === 'https:' || ['localhost','127.0.0.1'].includes(location.hostname);
      if (!isSecure) {
        alert('On mobile, camera requires HTTPS (or localhost). Use your ngrok URL.');
      }
      const stream = await (navigator.mediaDevices?.getUserMedia
        ? navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false })
        : Promise.reject(new Error('getUserMedia not available')));
      v.srcObject = stream;
      await new Promise(r => v.onloadedmetadata = r);
      resize();
      loop();
    }

    function resize() {
      const w = v.videoWidth || 1280, h = v.videoHeight || 720;
      [tx, view].forEach(c => { c.width = w; c.height = h; });
    }
    window.addEventListener('resize', resize);

    // ------- Click handling (tap twice = 2 points; double-tap clears) -------
    const pts = [];
    let lastTapTs = 0;
    view.addEventListener('pointerdown', (e) => {
      const now = performance.now();
      if (now - lastTapTs < 350) { // double tap -> clear
        pts.length = 0;
        lastTapTs = 0;
        return;
      }
      lastTapTs = now;
      // Map page coords to canvas coords
      const rect = view.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (view.width / rect.width);
      const y = (e.clientY - rect.top)  * (view.height / rect.height);
      pts.push([Math.round(x), Math.round(y)]);
      if (pts.length > 2) pts.shift();
    }, { passive:true });

    // ------- Networking -------
    let lastSent = 0;
    async function loop() {
      if (v.readyState >= 2) {
        const now = performance.now();
        if (now - lastSent >= POST_EVERY_MS) {
          lastSent = now;
          // draw current video frame into encoder canvas
          ctxT.drawImage(v, 0, 0, tx.width, tx.height);
          const blob = await new Promise(res => tx.toBlob(res, 'image/png'));
          const url = new URL('/charuco_detect', location.origin);
          url.searchParams.set('dict', BOARD.dict);
          url.searchParams.set('sx', BOARD.squares_x);
          url.searchParams.set('sy', BOARD.squares_y);
          url.searchParams.set('sq', BOARD.square_m);
          url.searchParams.set('mk', BOARD.marker_m);
          if (pts.length === 2) {
            url.searchParams.set('p1', pts[0].join(','));
            url.searchParams.set('p2', pts[1].join(','));
          }
          try {
            const resp = await fetch(url, { method:'POST', body: blob, cache:'no-store' });
            if (resp.ok) {
              const buf = await resp.arrayBuffer();
              const img = new Image();
              img.onload = () => {
                ctxV.drawImage(img, 0, 0, view.width, view.height);
                URL.revokeObjectURL(img.src);
              };
              img.src = URL.createObjectURL(new Blob([buf], { type:'image/png' }));
            }
          } catch (_) { /* ignore one-off errors */ }
        }
      }
      requestAnimationFrame(loop);
    }

    // Start
    (async () => {
      try { await startCam(); } catch (e) { alert('Camera error: ' + e); }
    })();
  </script>
</body>
</html>
